name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # ponytail: package-lock.json is gitignored, so no `npm ci` or npm cache; commit the lockfile to get both.
      - run: npm install
      - run: npm run lint
      - run: npm test
